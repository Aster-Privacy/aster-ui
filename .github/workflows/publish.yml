name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.local.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.cjs
          test -f dist/index.d.ts
          test -f dist/crypto/index.js
          test -f dist/styles/aster.css

      - id: local
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - id: gate
        env:
          npm_token: ${{ secrets.NPM_TOKEN }}
          version: ${{ needs.build.outputs.version }}
        run: |
          if [ -z "$npm_token" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not set, skipping the npmjs.com publish"
            exit 0
          fi
          if npm view "@aster-privacy/ui@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::version $version is already on npmjs.com"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - if: steps.gate.outputs.publish == 'true'
        run: npm run build

      - if: steps.gate.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github_packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: gate
        env:
          version: ${{ needs.build.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if npm view "@aster-privacy/ui@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::version $version is already in GitHub Packages"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      - if: steps.gate.outputs.publish == 'true'
        run: npm run build

      - if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@aster-privacy'

      - if: steps.gate.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [build, npm, github_packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists"
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
